name: Build ImmortalDL IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Proje Yapisi Olustur
        run: |
          mkdir -p Sources
          cp App.swift Sources/App.swift

          cat << 'EOF' > project.yml
          name: ImmortalDL
          options:
            bundleIdPrefix: com.sait
            deploymentTarget:
              iOS: "16.0"
          targets:
            ImmortalDL:
              type: application
              platform: iOS
              sources:
                - Sources
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: ImmortalDL
                  UILaunchScreen: {}
                  UIBackgroundModes:
                    - audio
                    - location
                    - fetch
                    - processing
                  NSLocationWhenInUseUsageDescription: "Arkaplanda indirmelerin durmamasi icin konum kilidi kullanilir."
                  NSLocationAlwaysAndWhenInUseUsageDescription: "Arkaplanda indirmelerin durmamasi icin konum kilidi kullanilir."
                  NSLocationAlwaysUsageDescription: "Arkaplanda indirmelerin durmamasi icin konum kilidi kullanilir."
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.sait.immortaldl
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: NO
          EOF

      - name: Xcode Projesi Uret ve Derle
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

          xcodebuild -project ImmortalDL.xcodeproj \
            -scheme ImmortalDL \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          echo "=== DERLENEN INFO.PLIST KONTROLU ==="
          plutil -p build/Build/Products/Release-iphoneos/ImmortalDL.app/Info.plist

      - name: IPA Paketle
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/ImmortalDL.app Payload/
          zip -r ImmortalDL.ipa Payload

      - name: IPA Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalDL-IPA
          path: ImmortalDL.ipa
